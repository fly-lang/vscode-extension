name: VSCode Extension

on:
  # Pull requests: build + test only (never publishes — fork PRs get no id-token).
  pull_request:
    branches: [main]

  # Push to main (i.e. a merged PR): build + test, then publish IF package.json
  # carries a version that has no tag yet. A merge that does not bump the version
  # builds, finds the tag already there, and skips the release without failing.
  push:
    branches: [main]

  # Manual re-run of the same pipeline (e.g. after a failed publish).
  workflow_dispatch:

# Never run two releases at once; never cancel one that is already publishing.
concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Build, test & package ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    outputs:
      version:    ${{ steps.meta.outputs.version }}
      vsix:       ${{ steps.meta.outputs.vsix }}
      tag_exists: ${{ steps.meta.outputs.tag_exists }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Unit tests (pure core modules)
        run: node tests/unit.js

      - name: Read version and check its tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from package.json"
            exit 1
          fi
          echo "version=${VERSION}"              >> $GITHUB_OUTPUT
          echo "vsix=vscode-fly-${VERSION}.vsix" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "tag_exists=true"  >> $GITHUB_OUTPUT
            echo "Version ${VERSION}: tag v${VERSION} already exists — no release will be made."
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Version ${VERSION}: tag v${VERSION} is new — eligible for release on main."
          fi

      # Use the scoped name: bare `vsce` on npm is the deprecated pre-2022 package.
      - name: Package (.vsix)
        run: npx @vscode/vsce package --out vscode-fly-${{ steps.meta.outputs.version }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-fly-vsix
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

  # ── Tag + GitHub Release + Marketplace publish ───────────────────────────
  # Only for a push (or manual run) on main whose version has no tag yet.
  release:
    needs: [build]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.build.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    # The Marketplace trusted-publishing policy names environment "production":
    # without this line the OIDC token carries no environment claim and the
    # exchange fails with 401 "token could not be exchanged for the publisher".
    environment: production
    permissions:
      contents: write   # create the tag and the GitHub Release
      id-token: write   # OIDC trusted publishing to the Marketplace

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: vscode-fly-vsix

      # Publish FIRST: if it fails (OIDC policy, network, ...) no tag and no GitHub
      # Release exist yet, so simply re-running the workflow retries cleanly. The
      # Marketplace itself rejects a version it already has, so a re-run after a
      # successful publish cannot publish twice.
      #
      # OIDC trusted publishing: no secret is stored anywhere — vsce asks GitHub
      # for an id-token scoped to marketplace.visualstudio.com and trades it for a
      # short-lived Marketplace credential. Needs `id-token: write` above AND a
      # trusted-publishing policy on the fly-lang publisher naming this repo and
      # this workflow file (publish-marketplace.yml).
      # The --oidc flag exists only in @vscode/vsce 4.x (3.9.x rejects it).
      - name: Publish to VS Code Marketplace (OIDC)
        run: npx --yes @vscode/vsce@^4.1.1 publish --oidc --packagePath ${{ needs.build.outputs.vsix }}

      - name: Create and push tag
        run: |
          VERSION=${{ needs.build.outputs.version }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "Fly VSCode Extension v${{ needs.build.outputs.version }}"
          generate_release_notes: true
          body: |
            ## Fly Language Support for VSCode — v${{ needs.build.outputs.version }}

            ### Install
            Download `${{ needs.build.outputs.vsix }}` then run:
            ```
            code --install-extension ${{ needs.build.outputs.vsix }}
            ```
            or drag-and-drop the file into the VSCode Extensions panel.
          files: ${{ needs.build.outputs.vsix }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
